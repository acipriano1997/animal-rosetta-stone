name: receiver-harness-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e .
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Execute RHF-001..035
        run: |
          mkdir -p build
          python scripts/run_rhf_suite.py --out build/rhf_suite_receipt.json
      - name: Execute ZERO_SYNTHETIC PR0006 verification
        run: python scripts/run_synthetic_verification.py --out-dir build/synthetic_verification
      - name: Verify Workbench Phase I Slice 1
        run: python scripts/verify_workbench_slice1.py
      - name: Verify Workbench Phase I Slice 2 adapter boundary
        run: python scripts/verify_workbench_slice2_adapter.py
      - name: Verify Workbench Phase I Slice 2 canonical producer boundary
        run: python scripts/verify_workbench_slice2_producer.py
      - name: Verify Workbench Phase I Slice 3 event/provenance exploration
        run: python scripts/verify_workbench_slice3_events.py
      - name: Verify Workbench Phase I Slice 4 evidence/rights navigation
        run: python scripts/verify_workbench_slice4_evidence.py
      - name: Probe public D0025 metadata (never source bytes)
        run: python scripts/probe_d0025_metadata.py --out build/d0025_metadata_probe.json
      - name: Check D0025 source-byte integrity (manifest only)
        if: github.head_ref == 'ars/d0025-source-integrity-v0.1'
        run: python scripts/freeze_d0025_source_integrity.py --out build/d0025_source_integrity.json
      - name: Inventory D0025 Excel headers only (codebook still held)
        if: github.head_ref == 'ars/d0025-header-inventory-v0.1' || github.head_ref == 'ars/d0025-structured-header-localization-v0.1'
        run: python scripts/inspect_d0025_headers.py --out build/d0025_header_inventory.json
      - name: Inspect D0025 supplementary document cues (no source files published)
        if: github.head_ref == 'ars/d0025-supplementary-codebook-review-v0.1'
        run: python scripts/review_d0025_supplementary_docs.py --out build/d0025_supplementary_doc_cues.json
      - name: Verify D0019 source metadata and bounded workbook headers
        if: github.head_ref == 'ars/d0019-figshare-source-probe-v0.1'
        run: python scripts/probe_d0019_source.py --out build/d0019_figshare_source_probe.json
      - name: Audit D0019 partition keys without examining outcomes
        if: github.head_ref == 'ars/d0019-partition-key-audit-v0.1'
        run: python scripts/audit_d0019_partition_keys.py --out build/d0019_partition_key_audit.json
      - name: Inspect D0019 Group 2 categorical vocabulary only
        if: github.head_ref == 'ars/d0019-rdc004-source-crosswalk-v0.1'
        run: python scripts/audit_d0019_group2_vocabulary.py --out build/d0019_group2_label_vocabulary.json
      - name: Audit D0019 Group 2 event and dyad identities only
        if: github.head_ref == 'ars/d0019-paper-backed-crosswalk-v0.2'
        run: python scripts/audit_d0019_group2_identity_dyad.py --out build/d0019_group2_identity_dyad_audit.json
      - name: Audit D0019 Group 2 eligibility and missingness only
        if: github.head_ref == 'ars/d0019-group2-eligibility-v0.1'
        run: python scripts/audit_d0019_group2_eligibility.py --out build/d0019_group2_eligibility_audit.json
      - name: Audit D0019 frozen grouped split support
        if: github.head_ref == 'ars/d0019-split-support-v0.1'
        run: python scripts/audit_d0019_split_support.py --out build/d0019_group2_split_support.json
      - name: Final D0019 RDC-004 pre-model admission (aggregate receipt only)
        if: github.head_ref == 'ars/d0019-final-admission-v0.1'
        run: python scripts/admit_d0019_rdc004.py --out build/d0019_final_admission.json
      - name: Verify PR0005 RUN-005 on ZERO_SYNTHETIC normalized data
        if: github.head_ref == 'ars/pr0005-run005-runner-v0.1'
        run: python scripts/run_pr0005_synthetic_verification.py --out build/pr0005_synthetic_verification.json
      - name: Verify PR0005 RUN-005 freeze package on ZERO_SYNTHETIC data
        if: github.head_ref == 'ars/pr0005-run005-freeze-package-v0.1'
        run: python scripts/run_pr0005_freeze_synthetic_verification.py --out-dir build/pr0005_freeze_synthetic
      - name: Verify PR0005 RUN-006 locked transfer on ZERO_SYNTHETIC data
        if: github.head_ref == 'ars/pr0005-run006-transfer-v0.1'
        run: python scripts/run_pr0005_transfer_synthetic_verification.py --out-dir build/pr0005_run006_synthetic
      - name: Upload exact-head verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: ars-receiver-harness-verification-${{ github.sha }}
          path: build/
          if-no-files-found: error
